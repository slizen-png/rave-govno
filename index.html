<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Наш Плеер</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; text-align: center; }
        video { width: 100%; max-height: 450px; background: #000; margin-top: 10px; }
        .controls { margin: 15px 0; padding: 10px; background: #222; border-radius: 5px; }
        input { padding: 8px; width: 60%; background: #333; color: #fff; border: 1px solid #555; }
        button { padding: 8px 15px; background: #007bff; color: #fff; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h1>Кинотеатр для двоих</h1>
    
    <div class="controls">
        <p>Статус комнаты: <b id="status" style="color: #ffcc00;">Подключение к серверу...</b></p>
        <p>Чтобы девушка подключилась, просто отправьте ей ССЫЛКУ на этот сайт!</p>
    </div>

    <div class="controls">
        <input type="text" id="video-url" placeholder="Вставь прямую ссылку на видео (.mp4)">
        <button id="load-video-btn">Открыть видео</button>
    </div>

    <video id="shared-video" controls></video>
</div>

<script>
    const video = document.getElementById('shared-video');
    const statusDisplay = document.getElementById('status');
    const videoUrlInput = document.getElementById('video-url');
    const loadVideoBtn = document.getElementById('load-video-btn');

    // Используем вечный бесплатный демонстрационный WebSocket-сервер
    const socket = new WebSocket('wss://://piehost.com');
    let isInternalChange = false;

    socket.onopen = () => {
        statusDisplay.innerText = "Онлайн! Комната готова.";
        statusDisplay.style.color = "#00ff00";
    };

    socket.onerror = () => {
        statusDisplay.innerText = "Ошибка сервера. Но мы все равно прорвемся!";
        statusDisplay.style.color = "#ff3333";
    };

    // Слушаем команды от второго человека
    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        isInternalChange = true;

        if (data.type === 'PLAY') video.play();
        if (data.type === 'PAUSE') video.pause();
        if (data.type === 'SEEK') video.currentTime = data.time;
        if (data.type === 'SRC') { video.src = data.url; video.load(); }

        setTimeout(() => { isInternalChange = false; }, 200);
    };

    // Отправляем команды при действиях в плеере
    video.addEventListener('play', () => {
        if (!isInternalChange) socket.send(JSON.stringify({ type: 'PLAY' }));
    });
    video.addEventListener('pause', () => {
        if (!isInternalChange) socket.send(JSON.stringify({ type: 'PAUSE' }));
    });
    video.addEventListener('seeking', () => {
        if (!isInternalChange) socket.send(JSON.stringify({ type: 'SEEK', time: video.currentTime }));
    });

    // Загрузка ссылки на видео
    loadVideoBtn.addEventListener('click', () => {
        const url = videoUrlInput.value.trim();
        if (url) {
            video.src = url;
            video.load();
            socket.send(JSON.stringify({ type: 'SRC', url: url }));
        }
    });
</script>

</body>
</html>
