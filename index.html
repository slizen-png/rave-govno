<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Наш Личный Кинотеатр</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; text-align: center; }
        video { width: 100%; max-height: 450px; background: #000; margin-top: 15px; border: 1px solid #333; }
        .controls { margin: 15px 0; padding: 15px; background: #222; border-radius: 5px; }
        input { padding: 10px; width: 65%; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; color: #fff; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background: #0056b3; }
        #error-msg { color: #ff3333; font-size: 14px; margin-top: 10px; font-weight: bold; }
    </style>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

<div class="container">
    <h1>Наш Личный Кинотеатр</h1>
    
    <div class="controls">
        <p>Статус: <b id="status" style="color: #ffcc00;">Подключение...</b></p>
    </div>

    <div class="controls">
        <input type="text" id="video-url" placeholder="Вставь ссылку master.m3u8">
        <button id="load-video-btn">Включить для двоих</button>
        <div id="error-msg"></div>
    </div>

    <video id="shared-video" controls autoplay playsinline></video>
</div>

<script>
    const video = document.getElementById('shared-video');
    const statusDisplay = document.getElementById('status');
    const videoUrlInput = document.getElementById('video-url');
    const loadVideoBtn = document.getElementById('load-video-btn');
    const errorMsg = document.getElementById('error-msg');
    const TUNNEL_HOST = 'fuzzy-towns-nail.loca.lt';


    const SERVER_HOST = 'localhost:8080'; 
    const socket = new WebSocket('ws://' + SERVER_HOST);
    let isInternalChange = false;
    let hls = null;

    socket.onopen = () => {
        statusDisplay.innerText = "Кинотеатр готов к работе!";
        statusDisplay.style.color = "#00ff00";
    };

    socket.onerror = () => {
        statusDisplay.innerText = "Ошибка подключения к твоему ПК.";
        statusDisplay.style.color = "#ff3333";
        errorMsg.innerText = "Убедись, что на ПК запущено окно CMD (node server.js)!";
    };

    function setVideoSource(rawUrl) {
        errorMsg.innerText = "";
        
        // БЕЗОПАСНОСТЬ: Полностью изолируем пиратскую ссылку от ломания параметров сервера
        const baseProxyUrl = 'http://' + SERVER_HOST + '/video';
        const urlParams = new URLSearchParams();
        urlParams.append('url', rawUrl);
        const proxiedUrl = baseProxyUrl + '?' + urlParams.toString();

        if (hls) { 
            hls.destroy(); 
            hls = null;
        }

        if (Hls.isSupported()) {
            hls = new Hls({
                maxBufferSize: 30 * 1000 * 1000,
                enableWorker: true
            });
            hls.loadSource(proxiedUrl);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    errorMsg.innerText = "Ошибка загрузки видео. Попробуй обновить ссылку на пиратском сайте.";
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = proxiedUrl;
        }
        
        video.load();
    }

    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        isInternalChange = true;

        if (data.type === 'PLAY') video.play().catch(() => {});
        if (data.type === 'PAUSE') video.pause();
        if (data.type === 'SEEK') video.currentTime = data.time;
        if (data.type === 'SRC') { setVideoSource(data.url); }

        setTimeout(() => { isInternalChange = false; }, 400);
    };

    loadVideoBtn.addEventListener('click', () => {
        const url = videoUrlInput.value.trim();
        if (!url) return;
        
        setVideoSource(url);
        if (socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: 'SRC', url: url }));
        }
    });

    video.addEventListener('play', () => { if (!isInternalChange && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'PLAY' })); });
    video.addEventListener('pause', () => { if (!isInternalChange && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'PAUSE' })); });
    video.addEventListener('seeked', () => { if (!isInternalChange && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'SEEK', time: video.currentTime })); });
</script>

</body>
</html>
