<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Наш Личный Кинотеатр</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; text-align: center; }
        video { width: 100%; max-height: 450px; background: #000; margin-top: 15px; }
        .controls { margin: 15px 0; padding: 15px; background: #222; border-radius: 5px; }
        input[type="file"] { display: none; }
        .file-btn { padding: 10px 20px; background: #007bff; color: #fff; border: none; cursor: pointer; border-radius: 4px; display: inline-block; }
        .file-btn:hover { background: #0056b3; }
        #file-name { margin-top: 10px; color: #aaa; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Наш Личный Кинотеатр</h1>
    
    <div class="controls">
        <p>Статус: <b id="status" style="color: #ffcc00;">Подключение к серверу...</b></p>
    </div>

    <div class="controls">
        <label class="file-btn">
            📁 Выбрать фильм с компьютера
            <input type="file" id="file-input" accept="video/*">
        </label>
        <div id="file-name">Файл не выбран. У вас с девушкой должен быть один и тот же файл!</div>
    </div>

    <video id="shared-video" controls></video>
</div>

<script>
    const video = document.getElementById('shared-video');
    const statusDisplay = document.getElementById('status');
    const fileInput = document.getElementById('file-input');
    const fileNameDisplay = document.getElementById('file-name');

    // Подключаемся к твоему серверу на Node.js
    const socket = new WebSocket('ws://localhost:8080');
    let isInternalChange = false;

    socket.onopen = () => {
        statusDisplay.innerText = "Соединение установлено! Сервер на ПК работает.";
        statusDisplay.style.color = "#00ff00";
    };

    socket.onerror = () => {
        statusDisplay.innerText = "Ошибка подключения. Убедись, что окно CMD с сервером открыто!";
        statusDisplay.style.color = "#ff3333";
    };

    // Локальное открытие файла (обходим CORS защиту браузера)
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            fileNameDisplay.innerText = "Выбран файл: " + file.name;
            const fileURL = URL.createObjectURL(file);
            video.src = fileURL;
            video.load();
        }
    });

    // Ловим команды от сервера
    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        isInternalChange = true;

        if (data.type === 'PLAY') video.play().catch(() => {});
        if (data.type === 'PAUSE') video.pause();
        if (data.type === 'SEEK') video.currentTime = data.time;

        setTimeout(() => { isInternalChange = false; }, 400);
    };

    // Отправляем команды на сервер
    video.addEventListener('play', () => {
        if (!isInternalChange && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: 'PLAY' }));
        }
    });

    video.addEventListener('pause', () => {
        if (!isInternalChange && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: 'PAUSE' }));
        }
    });

    video.addEventListener('seeked', () => {
        if (!isInternalChange && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: 'SEEK', time: video.currentTime }));
        }
    });
</script>

</body>
</html>
