<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Наш Личный Кинотеатр</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; text-align: center; }
        video { width: 100%; max-height: 450px; background: #000; margin-top: 15px; }
        .controls { margin: 15px 0; padding: 15px; background: #222; border-radius: 5px; }
        input { padding: 8px; width: 60%; background: #333; color: #fff; border: 1px solid #555; }
        button { padding: 8px 15px; background: #007bff; color: #fff; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
    <!-- Подключаем декодер для чтения ссылок m3u8 (VK, Rutube, Аллоха) -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

<div class="container">
    <h1>Наш Личный Кинотеатр</h1>
    
    <div class="controls">
        <p>Статус: <b id="status" style="color: #ffcc00;">Подключение...</b></p>
    </div>

    <div class="controls">
        <input type="text" id="video-url" placeholder="Вставь прямую ссылку (.mp4 или .m3u8)">
        <button id="load-video-btn">Включить для двоих</button>
    </div>

    <video id="shared-video" controls autoplay></video>
</div>

<script>
    const video = document.getElementById('shared-video');
    const statusDisplay = document.getElementById('status');
    const videoUrlInput = document.getElementById('video-url');
    const loadVideoBtn = document.getElementById('load-video-btn');

    const SERVER_HOST = 'localhost:8080'; 
    const socket = new WebSocket('ws://' + SERVER_HOST);
    let isInternalChange = false;
    let hls = null;

    socket.onopen = () => {
        statusDisplay.innerText = "Кинотеатр готов к работе!";
        statusDisplay.style.color = "#00ff00";
    };

    socket.onerror = () => {
        statusDisplay.innerText = "Ошибка подключения к твоему ПК.";
        statusDisplay.style.color = "#ff3333";
    };

    // Умная функция загрузки видео (поддерживает и mp4, и m3u8 потоки)
    function setVideoSource(rawUrl) {
        // Пропускаем ссылку через твой прокси-сервер на ПК для обхода CORS блокировок
        const proxiedUrl = 'http://' + SERVER_HOST + '/video?url=' + encodeURIComponent(rawUrl);

        if (rawUrl.includes('.m3u8')) {
            if (hls) { hls.destroy(); } // Уничтожаем старый поток, если он был
            
            if (Hls.isSupported()) {
                hls = new Hls({
                    xhrSetup: function (xhr) {
                        xhr.withCredentials = false; // Отключаем куки, чтобы базы не ругались
                    }
                });
                hls.loadSource(proxiedUrl);
                hls.attachMedia(video);
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Для Safari на смартфонах
                video.src = proxiedUrl;
            }
        } else {
            // Если вставили обычный .mp4
            if (hls) { hls.destroy(); hls = null; }
            video.src = proxiedUrl;
        }
        video.load();
    }

    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        isInternalChange = true;

        if (data.type === 'PLAY') video.play().catch(() => {});
        if (data.type === 'PAUSE') video.pause();
        if (data.type === 'SEEK') video.currentTime = data.time;
        if (data.type === 'SRC') { setVideoSource(data.url); }

        setTimeout(() => { isInternalChange = false; }, 400);
    };

    loadVideoBtn.addEventListener('click', () => {
        const url = videoUrlInput.value.trim();
        if (url) {
            setVideoSource(url);
            socket.send(JSON.stringify({ type: 'SRC', url: url }));
        }
    });

    video.addEventListener('play', () => { if (!isInternalChange) socket.send(JSON.stringify({ type: 'PLAY' })); });
    video.addEventListener('pause', () => { if (!isInternalChange) socket.send(JSON.stringify({ type: 'PAUSE' })); });
    video.addEventListener('seeked', () => { if (!isInternalChange) socket.send(JSON.stringify({ type: 'SEEK', time: video.currentTime })); });
</script>

</body>
</html>
